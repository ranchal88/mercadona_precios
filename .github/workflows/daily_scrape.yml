name: Daily Mercadona Scrape

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python scripts/mercadona_ccaa_daily.py

      - name: Set UTC date
        run: |
          DATE=$(date -u +%F)
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Package data folder
        run: |
          if [ ! -d "data" ]; then
            echo "❌ data/ directory not found"
            exit 1
          fi

          zip -r "mercadona_ccaa_${DATE}.zip" data

      - name: Upload outputs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ env.DATE }}
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "data-${{ env.DATE }}"
          name: "Mercadona CCAA - ${{ env.DATE }}"
          body: |
            Datos diarios por CCAA (CSV dentro del ZIP).
            Generado automáticamente por GitHub Actions.
          files: |
            mercadona_ccaa_${{ env.DATE }}.zip