name: Post Mercadona Top Down

on:
  schedule:
    - cron: '0 8 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  post_top_down:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Restore X cookies
        run: |
          echo '${{ secrets.X_COOKIES }}' > cookies.json

      - name: Generate assets and publish top down tweet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CONTENT_TYPE: down
          CCAA: madrid
          TOP_N: 5
          DAYS_WEEK: 7
          HEADLESS: true
          MAX_DATA_AGE_DAYS: 1
          ALLOW_STALE: false
        run: |
          python scripts/generate_and_tweet.py

      - name: Upload outputs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-post-top-down
          path: outputs/
          if-no-files-found: ignore
          retention-days: 7