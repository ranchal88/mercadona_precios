name: Generate Mercadona Top Down Assets

on:
  schedule:
    - cron: '0 8 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  generate_top_down_assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate top down assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CCAA: madrid
          TOP_N: 5
          DAYS_WEEK: 7
        run: |
          python scripts/generate_assets_only.py

      - name: Upload outputs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: outputs-post-top-down
          path: outputs/
          if-no-files-found: error
          retention-days: 7